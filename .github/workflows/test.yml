# .github/workflows/test.yml

name: Test

# Pushes to main are tested by publish.yml, which calls this workflow before it publishes.
on:
  push:
    branches: [ "develop", "release/**" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_call:

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC"

jobs:
  test:
    name: Run Multiplatform Tests
    runs-on: macOS-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run all tests
        run: ./gradlew check

      # Gradle has reported a browser test task as passing after it ran 481 of 646 tests, so a
      # green task is not proof the suite ran. iosX64Test cannot execute on an arm64 runner.
      - name: Verify every test ran
        run: python3 -I .github/scripts/verify_test_counts.py jvmTest jsBrowserTest wasmJsBrowserTest iosSimulatorArm64Test macosArm64Test

      # `check` never builds the publications, so a fault in the publishing task graph — a plugin
      # that assumes a task the Android target does not create, a broken POM, a missing artifact —
      # passes here and fails during release, after the tag has been cut. Assembling every
      # publication locally reproduces that in seconds and costs a couple of minutes here.
      # Signing is skipped: there are no signing keys on this workflow, and it is the task graph
      # and the artifacts being checked, not the credentials.
      - name: Verify the publications assemble
        run: ./gradlew publishToMavenLocal -Pskip-signing --no-configuration-cache

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'

      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

  test-linux:
    name: Run Linux Tests (linuxX64Test)
    # A macOS host cannot execute Linux test binaries, so check above skips them.
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Kotlin creates no linuxArm64Test task on any host, so the arm64 tests are linked here, where
      # Kotlin/Native can cross-compile them, and run by the job below on an arm64 runner.
      - name: Run Linux tests and link the arm64 test binary
        run: ./gradlew :types:linuxX64Test :types:linkDebugTestLinuxArm64

      - name: Verify every test ran
        run: python3 -I .github/scripts/verify_test_counts.py linuxX64Test

      - name: Keep the arm64 test binary
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-test-binary
          path: types/build/bin/linuxArm64/debugTest/test.kexe
          retention-days: 1

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/linuxX64Test/*.xml'
          check_name: 'JUnit Test Report (linuxX64Test)'

  test-linux-arm64:
    name: Run Linux Tests (linuxArm64)
    needs: test-linux
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fetch the arm64 test binary
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-test-binary
          path: arm64-test

      # The binary writes no JUnit XML, so its own log is what the count is checked against. It exits
      # non-zero when a test fails.
      - name: Run Linux arm64 tests
        run: |
          chmod +x arm64-test/test.kexe
          set -o pipefail
          arm64-test/test.kexe --ktest_logger=SIMPLE | tee arm64-test/test.log

      - name: Verify every test ran
        run: python3 -I .github/scripts/verify_test_counts.py --log linuxArm64Test=arm64-test/test.log

  # Kotlin/Native runs Windows tests only on a Windows host, so the macOS job above compiles
  # mingwX64 but cannot test it. This job is the only place its tests run.
  test-windows:
    name: Run Windows Tests
    runs-on: windows-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Windows tests
        shell: bash
        run: ./gradlew :types:mingwX64Test

      - name: Verify every test ran
        shell: bash
        run: python -I .github/scripts/verify_test_counts.py mingwX64Test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/mingwX64Test/*.xml'
          check_name: 'JUnit Test Report (Windows)'
