# .github/workflows/test.yml

name: Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC"

jobs:
  test:
    name: Run Multiplatform Tests
    runs-on: macOS-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run all tests
        run: ./gradlew check

      # `check` never builds the publications, so a fault in the publishing task graph — a plugin
      # that assumes a task the Android target does not create, a broken POM, a missing artifact —
      # passes here and fails during release, after the tag has been cut. Assembling every
      # publication locally reproduces that in seconds and costs a couple of minutes here.
      # Signing is skipped: there are no signing keys on this workflow, and it is the task graph
      # and the artifacts being checked, not the credentials.
      - name: Verify the publications assemble
        run: ./gradlew publishToMavenLocal -Pskip-signing --no-configuration-cache

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'

      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
